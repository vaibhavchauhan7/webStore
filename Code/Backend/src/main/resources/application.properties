# H2 Props - For H2, changes have been made in Security Controller, POM and this file
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.settings.web-allow-others=true

#Accessing the H2 Console : http://localhost:8080/h2-console
#JDBC URL: jdbc:h2:mem:testdb
#User: sa
#Password: (leave blank)

# For creating tables and preLoading them with data everytime on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:webStoreSchema.sql
spring.sql.init.data-locations=classpath:webStoreData.sql
spring.jpa.hibernate.ddl-auto=none
